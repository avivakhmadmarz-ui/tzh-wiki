<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Arial, sans-serif">
  <style>
    .title { font-size: 22px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
    .level-title { font-size: 18px; font-weight: bold; fill: white; text-anchor: middle; }
    .level-sub { font-size: 12px; fill: white; text-anchor: middle; }
    .horizon { font-size: 12px; fill: #555; text-anchor: middle; }
    .annotation { font-size: 11px; fill: #555; text-anchor: start; font-style: italic; }
  </style>
  <text x="400" y="35" class="title">OKR Pyramid — каскад от миссии до квартала</text>

  <!-- Mission -->
  <polygon points="350,70 450,70 470,120 330,120" fill="#7c2d12" stroke="#451a03" stroke-width="1"/>
  <text x="400" y="95" class="level-title">Mission</text>
  <text x="400" y="112" class="level-sub">Миссия (зачем мы существуем)</text>

  <!-- Vision -->
  <polygon points="320,120 480,120 510,180 290,180" fill="#b45309" stroke="#7c2d12" stroke-width="1"/>
  <text x="400" y="148" class="level-title">Vision</text>
  <text x="400" y="167" class="level-sub">Видение на 3-10 лет</text>

  <!-- Strategy -->
  <polygon points="280,180 520,180 555,250 245,250" fill="#ca8a04" stroke="#854d0e" stroke-width="1"/>
  <text x="400" y="212" class="level-title">Strategy</text>
  <text x="400" y="232" class="level-sub">Стратегия на 1-3 года</text>

  <!-- Annual OKR -->
  <polygon points="240,250 560,250 600,330 200,330" fill="#15803d" stroke="#14532d" stroke-width="1"/>
  <text x="400" y="285" class="level-title">Annual OKRs</text>
  <text x="400" y="305" class="level-sub">Годовые цели компании</text>
  <text x="400" y="322" class="level-sub">3-5 Objectives</text>

  <!-- Quarterly OKRs -->
  <polygon points="195,330 605,330 660,440 140,440" fill="#0891b2" stroke="#155e75" stroke-width="1"/>
  <text x="400" y="370" class="level-title">Quarterly OKRs</text>
  <text x="400" y="392" class="level-sub">Квартальные цели</text>
  <text x="400" y="412" class="level-sub">Company → Team → Individual</text>
  <text x="400" y="430" class="level-sub">Каждый Objective: 3-5 Key Results</text>

  <!-- Daily work -->
  <polygon points="135,440 665,440 720,540 80,540" fill="#2563eb" stroke="#1e3a8a" stroke-width="1"/>
  <text x="400" y="478" class="level-title">Tasks · Initiatives · Daily work</text>
  <text x="400" y="500" class="level-sub">Что делается каждую неделю/спринт</text>
  <text x="400" y="520" class="level-sub">для движения KR'ов</text>
  <text x="400" y="535" class="level-sub" font-style="italic">(не путать с самими OKR)</text>

  <!-- Right side annotations -->
  <line x1="660" y1="95" x2="710" y2="95" stroke="#555" stroke-width="1"/>
  <text x="715" y="100" class="annotation">"Зачем"</text>

  <line x1="660" y1="215" x2="710" y2="215" stroke="#555" stroke-width="1"/>
  <text x="715" y="220" class="annotation">"Куда"</text>

  <line x1="710" y1="380" x2="745" y2="380" stroke="#555" stroke-width="1"/>
  <text x="750" y="385" class="annotation">"Что"</text>

  <line x1="730" y1="490" x2="765" y2="490" stroke="#555" stroke-width="1"/>
  <text x="770" y="495" class="annotation">"Как"</text>

  <!-- Left side: time horizon -->
  <text x="40" y="100" class="horizon" text-anchor="start">∞</text>
  <text x="40" y="220" class="horizon" text-anchor="start">3-10 лет</text>
  <text x="40" y="290" class="horizon" text-anchor="start">1-3 года</text>
  <text x="40" y="380" class="horizon" text-anchor="start">12 мес</text>
  <text x="40" y="490" class="horizon" text-anchor="start">квартал</text>

  <!-- Bottom -->
  <text x="400" y="580" class="horizon" font-style="italic">OKR живут в среднем-нижнем слое — превращают стратегию в исполняемые цели на квартал</text>
</svg>
