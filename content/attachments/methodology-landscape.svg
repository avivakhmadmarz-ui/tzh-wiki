<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="Arial, sans-serif">
  <style>
    .title { font-size: 22px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
    .axis-label { font-size: 14px; fill: #1a1a1a; font-weight: bold; }
    .domain { font-size: 13px; font-weight: bold; fill: white; text-anchor: middle; }
    .method { font-size: 11px; fill: white; text-anchor: middle; }
    .horizon-label { font-size: 12px; fill: #555; text-anchor: middle; font-style: italic; }
    .quote { font-size: 12px; fill: #444; text-anchor: middle; font-style: italic; }
  </style>
  <text x="550" y="35" class="title">Ландшафт методологий — что когда применять</text>
  <text x="550" y="60" class="quote">По осям: что планируем (операции/цели/финансы) × горизонт (день → стратегия)</text>

  <!-- Axes -->
  <line x1="180" y1="700" x2="1050" y2="700" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="180" y1="100" x2="180" y2="700" stroke="#1a1a1a" stroke-width="2"/>

  <!-- X-axis: time horizon -->
  <text x="615" y="745" class="axis-label" text-anchor="middle">→ Горизонт планирования</text>
  <text x="260" y="720" class="horizon-label">День / неделя</text>
  <text x="425" y="720" class="horizon-label">Квартал</text>
  <text x="615" y="720" class="horizon-label">12-24 мес</text>
  <text x="800" y="720" class="horizon-label">3-5 лет</text>
  <text x="970" y="720" class="horizon-label">Видение</text>

  <!-- Y-axis: domain -->
  <text x="100" y="400" class="axis-label" text-anchor="middle" transform="rotate(-90 100 400)">↑ Что планируем</text>

  <!-- Y-axis labels (right side helpful labels) -->
  <text x="170" y="170" class="axis-label" text-anchor="end">Стратегия</text>
  <text x="170" y="320" class="axis-label" text-anchor="end">Цели</text>
  <text x="170" y="490" class="axis-label" text-anchor="end">Операции</text>
  <text x="170" y="640" class="axis-label" text-anchor="end">Финансы</text>

  <!-- Strategy row -->
  <rect x="800" y="100" width="240" height="80" rx="6" fill="#7c2d12" opacity="0.9"/>
  <text x="920" y="130" class="domain">Strategic Vision</text>
  <text x="920" y="150" class="method">Hoshin Kanri (3-5 lat)</text>
  <text x="920" y="168" class="method">Mission · Vision statements</text>

  <rect x="600" y="100" width="190" height="80" rx="6" fill="#b45309" opacity="0.9"/>
  <text x="695" y="130" class="domain">Long-term plan</text>
  <text x="695" y="150" class="method">Strategic OKR</text>
  <text x="695" y="168" class="method">Strategy Map (BSC)</text>

  <!-- Goals row -->
  <rect x="400" y="270" width="180" height="100" rx="6" fill="#15803d" opacity="0.9"/>
  <text x="490" y="300" class="domain">Quarterly OKR</text>
  <text x="490" y="320" class="method">Objectives + Key Results</text>
  <text x="490" y="338" class="method">Stretch goals · 3-5 шт</text>
  <text x="490" y="356" class="method">Google · Intel · LinkedIn</text>

  <rect x="220" y="270" width="170" height="100" rx="6" fill="#0891b2" opacity="0.9"/>
  <text x="305" y="300" class="domain">KPI · Dashboards</text>
  <text x="305" y="320" class="method">BSC 4 perspectives</text>
  <text x="305" y="338" class="method">Health metrics</text>
  <text x="305" y="356" class="method">Daily / weekly</text>

  <!-- Operations row -->
  <rect x="600" y="430" width="200" height="120" rx="6" fill="#2563eb" opacity="0.9"/>
  <text x="700" y="460" class="domain">S&amp;OP · IBP</text>
  <text x="700" y="480" class="method">Tactical-strategic plan</text>
  <text x="700" y="498" class="method">Demand-supply consensus</text>
  <text x="700" y="516" class="method">18-24 мес</text>
  <text x="700" y="534" class="method">P&amp;G · Cisco · Unilever</text>

  <rect x="420" y="430" width="170" height="120" rx="6" fill="#7c3aed" opacity="0.9"/>
  <text x="505" y="460" class="domain">DDMRP · MRP II</text>
  <text x="505" y="480" class="method">Pull / push execution</text>
  <text x="505" y="498" class="method">Buffer management</text>
  <text x="505" y="516" class="method">3-12 мес</text>
  <text x="505" y="534" class="method">Michelin · Coca-Cola</text>

  <rect x="220" y="430" width="190" height="120" rx="6" fill="#dc2626" opacity="0.9"/>
  <text x="315" y="460" class="domain">Lean · TPS · LSS</text>
  <text x="315" y="480" class="method">Поток · устранение муда</text>
  <text x="315" y="498" class="method">Daily management</text>
  <text x="315" y="516" class="method">Postoянно</text>
  <text x="315" y="534" class="method">Toyota · Boeing · GE</text>

  <rect x="810" y="430" width="180" height="120" rx="6" fill="#ea580c" opacity="0.9"/>
  <text x="900" y="460" class="domain">Theory of</text>
  <text x="900" y="478" class="domain">Constraints</text>
  <text x="900" y="498" class="method">5 focusing steps</text>
  <text x="900" y="516" class="method">DBR · throughput</text>
  <text x="900" y="534" class="method">Goldratt</text>

  <!-- Finance row -->
  <rect x="220" y="600" width="240" height="90" rx="6" fill="#0f766e" opacity="0.9"/>
  <text x="340" y="630" class="domain">KPI бюджета · Daily P&amp;L</text>
  <text x="340" y="650" class="method">Cash flow · margin</text>
  <text x="340" y="668" class="method">Standard accounting</text>
  <text x="340" y="685" class="method">Operational финансы</text>

  <rect x="470" y="600" width="190" height="90" rx="6" fill="#9d174d" opacity="0.9"/>
  <text x="565" y="630" class="domain">ZBB</text>
  <text x="565" y="650" class="method">Zero-Based Budgeting</text>
  <text x="565" y="668" class="method">3G Capital · ABInBev</text>
  <text x="565" y="685" class="method">Annual reset</text>

  <rect x="670" y="600" width="220" height="90" rx="6" fill="#be185d" opacity="0.9"/>
  <text x="780" y="630" class="domain">Beyond Budgeting</text>
  <text x="780" y="650" class="method">Bjarte Bogsnes</text>
  <text x="780" y="668" class="method">Adaptive planning</text>
  <text x="780" y="685" class="method">Handelsbanken · Statoil</text>

  <!-- Bottom annotation -->
  <text x="550" y="775" class="quote">Стрелки: Hoshin → каскадируется в OKR → Lean выполняет ежедневно. KPI следят за здоровьем во всех слоях.</text>
</svg>
