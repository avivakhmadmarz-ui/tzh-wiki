<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" font-family="Arial, sans-serif">
  <style>
    .title { font-size: 22px; font-weight: bold; fill: #1a1a1a; text-anchor: middle; }
    .quadrant-title { font-size: 16px; font-weight: bold; fill: white; text-anchor: middle; }
    .quadrant-sub { font-size: 11px; fill: white; text-anchor: middle; }
    .annotation { font-size: 11px; fill: #555; text-anchor: middle; font-style: italic; }
    .corner { font-size: 10px; fill: #555; text-anchor: middle; }
  </style>
  <text x="400" y="35" class="title">Hoshin Kanri X-Matrix</text>
  <text x="400" y="58" class="annotation">Стратегическое разворачивание — связь долгосрочной стратегии с ежедневными действиями</text>

  <!-- Center diamond -->
  <polygon points="400,200 600,400 400,600 200,400" fill="#1e293b" stroke="#000" stroke-width="2"/>
  <text x="400" y="395" font-size="20" fill="white" text-anchor="middle" font-weight="bold">X</text>
  <text x="400" y="415" font-size="11" fill="#cbd5e1" text-anchor="middle">центр</text>

  <!-- Top: Long-term breakthrough objectives -->
  <polygon points="200,100 600,100 600,200 200,200" fill="#dc2626"/>
  <text x="400" y="130" class="quadrant-title">TOP — Long-term Breakthrough Objectives</text>
  <text x="400" y="150" class="quadrant-sub">3-5 лет, 3-5 прорывных целей</text>
  <text x="400" y="168" class="quadrant-sub">«Удвоить выручку», «Стать №1 в категории», «Войти в US»</text>
  <text x="400" y="186" class="corner">↓ откуда — стратегия / Vision / Mission</text>

  <!-- Left: Annual objectives -->
  <polygon points="100,200 200,200 200,400 100,400" fill="#0891b2"/>
  <text x="150" y="270" class="quadrant-title" transform="rotate(-90 150 270)">LEFT — Annual</text>
  <text x="150" y="290" class="quadrant-sub" transform="rotate(-90 150 290)">Objectives (1 год)</text>
  <text x="150" y="320" class="quadrant-sub" transform="rotate(-90 150 320)">3-5 целей на год</text>

  <!-- Bottom: Improvement priorities (initiatives) -->
  <polygon points="200,600 600,600 600,700 200,700" fill="#15803d"/>
  <text x="400" y="630" class="quadrant-title">BOTTOM — Improvement Priorities (Tactics)</text>
  <text x="400" y="650" class="quadrant-sub">Что конкретно делаем — проекты, инициативы, процессы</text>
  <text x="400" y="668" class="quadrant-sub">Owner: команды</text>
  <text x="400" y="688" class="corner">↑ кто — конкретные люди и команды</text>

  <!-- Right: Targets to improve / Metrics -->
  <polygon points="600,200 700,200 700,400 600,400" fill="#7c3aed"/>
  <text x="650" y="270" class="quadrant-title" transform="rotate(90 650 270)">RIGHT — Targets</text>
  <text x="650" y="290" class="quadrant-sub" transform="rotate(90 650 290)">to Improve</text>
  <text x="650" y="320" class="quadrant-sub" transform="rotate(90 650 320)">KPI / измеряемые цели</text>

  <!-- Far right: Owners and resources -->
  <polygon points="600,400 700,400 700,600 600,600" fill="#b45309"/>
  <text x="650" y="470" class="quadrant-title" transform="rotate(90 650 470)">Owners</text>
  <text x="650" y="490" class="quadrant-sub" transform="rotate(90 650 490)">/ Resources</text>
  <text x="650" y="520" class="quadrant-sub" transform="rotate(90 650 520)">Кто ведёт инициативу</text>

  <!-- Far left: Cross-checks -->
  <polygon points="100,400 200,400 200,600 100,600" fill="#475569"/>
  <text x="150" y="470" class="quadrant-title" transform="rotate(-90 150 470)">Cross-</text>
  <text x="150" y="490" class="quadrant-sub" transform="rotate(-90 150 490)">checks</text>

  <!-- Connection lines explanation -->
  <text x="400" y="745" class="annotation">«X» в матрице = correlation cells: где annual objective связан с tactics, какие KPI отслеживают какие инициативы</text>
  <text x="400" y="765" class="annotation">Catchball: матрица каскадируется через ВСЕ уровни — каждый уровень обсуждает и согласует свою X-matrix</text>
  <text x="400" y="785" class="annotation">Используется в Toyota, Danaher, HP — мост между OKR/BSC и Lean daily management</text>
</svg>
